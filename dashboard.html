<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<header>

<h1>Smart Student Service Portal</h1>

<a href="index.html" class="logout-btn">Logout</a>

</header>

<h2 class="dashboard-title">Student Dashboard</h2>

<div class="dashboard">

<div class="card" onclick="location.href='leave.html'">

<i class="fa-solid fa-user-check"></i>

<h3>Apply Leave</h3>

<p>Submit Leave Request</p>

</div>

<div class="card" onclick="location.href='od.html'">

<i class="fa-solid fa-calendar-days"></i>

<h3>Apply OD</h3>

<p>Submit On Duty Request</p>

</div>

<div class="card" onclick="location.href='bonafide.html'">

<i class="fa-solid fa-file"></i>

<h3>Bonafide</h3>

<p>Request Certificate</p>

</div>

<div class="card" onclick="location.href='complaint.html'">

<i class="fa-solid fa-triangle-exclamation"></i>

<h3>Complaint</h3>

<p>Submit Complaint</p>

</div>

<div class="card" onclick="location.href='status.html'">

<i class="fa-solid fa-chart-line"></i>

<h3>View Status</h3>

<p>Check Request Status</p>

</div>

<div class="card" onclick="location.href='admin.html'">

<i class="fa-solid fa-user-shield"></i>

<h3>Admin</h3>

<p>Admin Panel</p>

</div>

</div>

</body>
</html>
